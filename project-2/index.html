<body>

  <div class="header">
    <a href="../index.html">HOME</a>
    <a href="../yt/">Youtube Chanel</a>
  </div>
  <form class="container">
    <h2>BMI Calculator</h2>
    <div class="input">
      <label for="height">Height in CM:</label>
      <input type="text" name="height" id="height" class="height-value">
    </div>
    <div class="input">
      <label for="weight">Weight in KG:</label>
      <input type="text" name="weight" id="weight" class="weight-value">
    </div>
    <input type="submit" value="Calculate" class="submit-btn">
  </form>
  <div class="result"></div>
  <div class="guide">
    <h4>BMI Weight Guide</h4>
    <p>Under Weight = Less than 18.6</p>
    <p>Normal Range = 18.6 and 24.9</p>
    <p>Overweight = Greater than 24.9</p>
  </div>

</body>
